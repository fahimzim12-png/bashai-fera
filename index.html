
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101211">
  <title>Bashai Fera — A Dhaka Road Survival Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="topbar">
      <span class="brand">BF<span class="dot">.</span></span>
      <span class="edition">A DHAKA ROAD EXPERIENCE</span>
    </div>

    <section class="hero">
      <div class="eyebrow">
        <span class="live-dot"></span>
        EVERY JOURNEY HAS A STORY
      </div>

      <h1>BASHAI<br><span>FERA.</span></h1>

      <p class="subtitle">
        The city never stops moving.<br>
        Neither can you.
      </p>

      <button id="startButton" class="start-button">
        <span id="buttonText">BEGIN YOUR JOURNEY</span>
        <span class="arrow">↗</span>
      </button>

      <p id="message" class="message">
        A road-survival experience inspired by Dhaka.
      </p>
    </section>

    <div class="bottom">
      <span>DHAKA, BANGLADESH</span>
      <span>GET HOME. THAT'S THE GOAL.</span>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
