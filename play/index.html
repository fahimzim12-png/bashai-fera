
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bashai Fera | First Walk Home</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111814;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#top{position:fixed;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.brand{font-size:11px;letter-spacing:3px;color:#d9ef78;font-weight:bold}
.sub{font-size:10px;letter-spacing:2px;margin-top:5px;color:#c3cec3}
#distance{text-align:right;font-size:11px;letter-spacing:1px}
#pause{position:fixed;top:65px;right:16px;z-index:4;background:#17221b;color:white;border:1px solid #647265;padding:10px 16px;border-radius:8px}
#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;background:#101914c9;padding:10px 15px;border:1px solid #ffffff33;border-radius:30px;white-space:nowrap}
#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#07100cce;padding:20px}
.panel{max-width:430px;width:100%;padding:30px;background:#111b16;border:1px solid #ffffff26;border-radius:15px}
.eyebrow{font-size:11px;letter-spacing:3px;color:#d9ef78;font-weight:bold}
h1{font-size:48px;line-height:.95;letter-spacing:-2px;margin:20px 0}
p{font-size:13px;line-height:1.7;color:#c2ccc2}
#start{width:100%;padding:16px;background:#d9ef78;border:0;border-radius:8px;font-weight:bold;letter-spacing:1px;margin-top:12px}
#touch{position:fixed;bottom:65px;left:0;right:0;z-index:3;display:none;justify-content:space-between;padding:0 25px;pointer-events:none}
.touchbtn{width:65px;height:65px;border-radius:50%;border:1px solid #ffffff66;background:#111b16bb;color:white;font-size:28px;pointer-events:auto}
@media(pointer:coarse){#touch{display:flex}#help{bottom:145px;font-size:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
 <div><div class="brand">BASHAI FERA</div><div class="sub">EVERY JOURNEY HAS A STORY</div></div>
 <div id="distance">FIRST WALK HOME<br>DISTANCE: 000 M</div>
</div>
<button id="pause">PAUSE</button>
<div id="help">A / D OR ARROW KEYS TO STEER</div>
<div id="touch">
 <button class="touchbtn" id="left">‹</button>
 <button class="touchbtn" id="right">›</button>
</div>
<div id="overlay">
 <div class="panel">
  <div class="eyebrow">MILESTONE 01 · DHAKA</div>
  <h1>THE FIRST<br>WALK HOME.</h1>
  <p>You are walking through the streets of Dhaka. You keep moving forward. Your job is to find your way through the street.</p>
  <button id="start">BEGIN WALKING →</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const mount=document.getElementById('game');
const overlay=document.getElementById('overlay');
const startButton=document.getElementById('start');
const pauseButton=document.getElementById('pause');
const distanceDisplay=document.getElementById('distance');

let scene,camera,renderer,clock;
let player,limbs,roadSegments=[],traffic=[];
let started=false,paused=false,distance=0;
let steering=0,targetSteering=0;
const keys=new Set();
const mobile=matchMedia('(pointer:coarse)').matches;

function material(color){
 return new THREE.MeshStandardMaterial({color,roughness:1});
}
const M={
 road:material(0x343a38),
 line:material(0xd9d2b5),
 footpath:material(0x777c73),
 curb:material(0xb8b4a8),
 skin:material(0xb87950),
 shirt:material(0x4d6257),
 pants:material(0x303b3c),
 dark:material(0x202522),
 glass:material(0x29454a),
 bus:material(0xb9a64c),
 green:material(0x287b58),
 tree:material(0x486b4c),
 trunk:material(0x66513b),
 building:material(0xb6aa91),
 sign:material(0x1d4d43)
};

function box(parent,w,h,d,mat,x=0,y=0,z=0){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 parent.add(mesh);
 return mesh;
}

function createPlayer(){
 const root=new THREE.Group();

 box(root,.48,.68,.25,M.shirt,0,1.22,0);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.19,12,10),M.skin
 );
 head.position.y=1.72;
 root.add(head);

 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.195,12,8,0,Math.PI*2,0,Math.PI*.55),
  M.dark
 );
 hair.position.set(0,1.79,-.015);
 root.add(hair);

 const armL=box(root,.15,.58,.16,M.shirt,-.32,1.22,0);
 const armR=box(root,.15,.58,.16,M.shirt,.32,1.22,0);
 const legL=box(root,.19,.67,.2,M.pants,-.13,.48,0);
 const legR=box(root,.19,.67,.2,M.pants,.13,.48,0);

 box(root,.22,.12,.34,M.dark,-.13,.12,-.045);
 box(root,.22,.12,.34,M.dark,.13,.12,-.045);

 limbs={armL,armR,legL,legR};
 return root;
}

function createBuilding(x,z){
 const group=new THREE.Group();

 const width=5+Math.random()*3;
 const height=8+Math.random()*9;
 const depth=5+Math.random()*4;

 box(group,width,height,depth,M.building,0,height/2,0);

 for(let floor=1;floor<height/2.5;floor++){
  const y=floor*2.5;
  for(let col=-1;col<=1;col++){
   box(group,.7,.85,.04,M.glass,col*width*.25,y,depth/2+.03);
  }
 }

 box(group,width*.8,.5,.12,M.sign,0,2.8,depth/2+.08);

 group.position.set(x,0,z);
 scene.add(group);
}

function createTree(x,z){
 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.2,1.5,7),M.trunk
 );
 trunk.position.y=.75;
 group.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.IcosahedronGeometry(1,1),M.tree
 );
 crown.position.y=2;
 group.add(crown);

 group.position.set(x,0,z);
 scene.add(group);
}

function createRickshaw(x,z){
 const g=new THREE.Group();

 box(g,1.35,.12,2.2,M.dark,0,.42,0);
 box(g,1.18,.75,1.05,M.green,0,.95,-.18);
 box(g,1.25,.08,1.25,M.bus,0,1.38,-.18);
 box(g,.95,.55,.06,M.glass,0,.98,-.72);

 for(const wx of [-.58,.58]){
  for(const wz of [-.72,.72]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.27,.27,.12,12),M.dark
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(wx,.28,wz);
   g.add(wheel);
  }
 }

 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function createBus(x,z){
 const g=new THREE.Group();

 box(g,2.35,2.65,6.2,M.bus,0,1.55,0);
 box(g,2.38,.5,6.22,M.green,0,.65,0);

 for(const side of [-1,1]){
  for(let i=0;i<4;i++){
   box(g,.04,.65,.85,M.glass,side*1.19,2,-2.2+i*1.35);
  }
 }

 box(g,2.2,.5,.05,M.glass,0,2.05,-3.13);

 for(const side of [-1,1]){
  for(const zpos of [-2,2]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.42,.42,.16,12),M.dark
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(side*1.2,.48,zpos);
   g.add(wheel);
  }
 }

 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function createRoad(z){
 const group=new THREE.Group();

 box(group,12,.12,20,M.road,0,-.08,0);

 box(group,2.2,.015,20,M.line,-3.65,-.005,0);
 box(group,2.2,.015,20,M.line,3.65,-.005,0);
 box(group,2,.015,20,M.line,0,-.005,0);

 for(const side of [-1,1]){
  box(group,3,.22,20,M.curb,side*7.5,.02,0);
  box(group,5,.12,20,M.footpath,side*11,.02,0);
 }

 group.position.z=z;
 scene.add(group);
 roadSegments.push(group);
}

function buildWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9daea9);
 scene.fog=new THREE.Fog(0x9daea9,28,115);

 camera=new THREE.PerspectiveCamera(
  62,innerWidth/innerHeight,.1,180
 );
 camera.position.set(0,4.1,7.6);

 renderer=new THREE.WebGLRenderer({
  antialias:!mobile,
  powerPreference:'high-performance'
 });
 renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.2:1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 mount.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xe6f0e6,0x555047,2));

 const sun=new THREE.DirectionalLight(0xffe0b5,2);
 sun.position.set(-10,18,8);
 scene.add(sun);

 // Distant Dhaka skyline
 for(let i=0;i<18;i++){
  const x=(i%2?1:-1)*(17+Math.random()*18);
  const z=-35-Math.random()*90;
  const h=10+Math.random()*20;
  box(scene,7,h,7,material(0x89958e),x,h/2,z);
 }

 // Road sections
 for(let i=0;i<8;i++)createRoad(10-i*20);

 // Roadside buildings and trees
 for(let z=-12;z>-145;z-=18){
  createBuilding(-13,z);
  createBuilding(13,z-7);

  if(Math.random()>.35)createTree(-9.1,z-8);
  if(Math.random()>.35)createTree(9.1,z-2);
 }

 // Static traffic scenery
 for(let i=0;i<4;i++){
  const z=-22-i*25;
  traffic.push({
   mesh:createBus(-4.3,z),
   speed:2.5
  });
  traffic.push({
   mesh:createRickshaw(4.2,z-10),
   speed:3.5
  });
 }

 player=new THREE.Group();
 player.add(createPlayer());
 player.position.set(0,0,0);
 scene.add(player);
}

function resize(){
 if(!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(
  devicePixelRatio,
  matchMedia('(pointer:coarse)').matches?1.2:1.7
 ));
}
window.addEventListener('resize',resize);

function readKeys(){
 let value=0;
 if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))value--;
 if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))value++;
 targetSteering=value;
}

window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)){
  e.preventDefault();
 }
 keys.add(e.key);
 readKeys();

 if(e.key==='Escape'||e.key==='p'||e.key==='P')togglePause();
});

window.addEventListener('keyup',e=>{
 keys.delete(e.key);
 readKeys();
});

function bindTouch(id,direction){
 const button=document.getElementById(id);

 button.addEventListener('pointerdown',e=>{
  e.preventDefault();
  targetSteering=direction;
 });

 function release(e){
  e.preventDefault();
  if(targetSteering===direction)targetSteering=0;
 }

 button.addEventListener('pointerup',release);
 button.addEventListener('pointercancel',release);
 button.addEventListener('pointerleave',release);
}

bindTouch('left',-1);
bindTouch('right',1);

function togglePause(){
 if(!started)return;

 paused=!paused;
 pauseButton.textContent=paused?'RESUME':'PAUSE';

 if(paused){
  overlay.style.display='grid';
  overlay.querySelector('h1').innerHTML='TAKE A<br>BREATHER.';
  overlay.querySelector('p').textContent='Your journey is paused. Continue when ready.';
  startButton.textContent='RESUME JOURNEY →';
 }else{
  overlay.style.display='none';
 }
}
pauseButton.addEventListener('click',togglePause);

function update(dt){
 if(!started||paused)return;

 distance+=dt*2.5;

 steering=THREE.MathUtils.damp(
  steering,targetSteering,7,dt
 );

 player.position.x=THREE.MathUtils.clamp(
  player.position.x+steering*dt*5.1,-4.6,4.6
 );

 const swing=Math.sin(distance*3.2)*.42;

 limbs.legL.rotation.x=swing;
 limbs.legR.rotation.x=-swing;
 limbs.armL.rotation.x=-swing*.7;
 limbs.armR.rotation.x=swing*.7;

 player.children[0].rotation.z=THREE.MathUtils.lerp(
  player.children[0].rotation.z,-steering*.07,.08
 );

 // Recycle road sections to simulate forward movement.
 for(const road of roadSegments){
  road.position.z+=8.5*dt;
  if(road.position.z>30)road.position.z-=160;
 }

 // Move surrounding traffic towards the player.
 for(const vehicle of traffic){
  vehicle.mesh.position.z+=8.5*dt*(.72+vehicle.speed*.08);

  if(vehicle.mesh.position.z>18){
   vehicle.mesh.position.z=-105-Math.random()*30;
  }
 }

 const desired=new THREE.Vector3(
  player.position.x*.48,4,7.6
 );

 camera.position.lerp(
  desired,1-Math.exp(-3.5*dt)
 );

 camera.lookAt(player.position.x*.25,1.25,-11);

 distanceDisplay.innerHTML=
  'FIRST WALK HOME<br>DISTANCE: '+
  String(Math.floor(distance)).padStart(3,'0')+' M';
}

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 update(dt);

 renderer.render(scene,camera);
}

function startGame(){
 if(!renderer){
  buildWorld();
  clock=new THREE.Clock();
  animate();
 }

 started=true;
 paused=false;
 overlay.style.display='none';
 pauseButton.textContent='PAUSE';
}

startButton.addEventListener('click',()=>{
 if(paused){
  paused=false;
  overlay.style.display='none';
  pauseButton.textContent='PAUSE';
 }else{
  startGame();
 }
});

window.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
